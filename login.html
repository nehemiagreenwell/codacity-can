<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Codacity</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="logo">Codacity</div>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle">
        🌙
      </button>
      <button class="menu-toggle" id="menu-toggle">
        &#9776;
      </button>
    </div>
    <nav class="nav-menu" id="nav-menu">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="pricing.html">Pricing</a>
    </nav>
  </header>
  <!-- LOGIN SECTION -->
  <main class="auth-page">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">
        Login to continue your developer journey
      </p>
      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" required="required" placeholder="Enter your email">
           <small class="error-message" id="login-email-error"></small>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required="required" placeholder="Enter your password">
          <small class="error-message" id="login-password-error"></small>
        </div>
        <button type="submit" class="auth-btn">
          Login
        </button>
      </form>
      <p class="auth-switch">
        Don't have an account?
        <a href="register.html">Register</a>
      </p>
    </div>
  </main>
  <script src="scripts.js"></script>
</body>
</html>
