<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Codacity</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">Codacity</div>

    <div class="header-actions">

  <button class="theme-toggle" id="theme-toggle">
    🌙
  </button>

  <button class="menu-toggle" id="menu-toggle">
    &#9776;
  </button>

</div>

    <nav class="nav-menu" id="nav-menu">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="pricing.html">Pricing</a>
    </nav>
  </header>

  <!-- REGISTER SECTION -->
  <main class="auth-page">

    <div class="auth-card">

      <h1>Create Account</h1>

      <p class="auth-subtitle">
        Join the Codacity developer community
      </p>

      <form id="register-form">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="register-name" placeholder="Enter your full name">
           <small class="error-message" id="register-name-error"></small>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="register-email" placeholder="Enter your email">
          <small class="error-message" id="register-email-error"></small>

        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="register-password" placeholder="Create password">
          <small class="error-message" id="register-password-error"></small>

        </div>
        
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="register-confirm-password" placeholder="Confirm password">
           <small class="error-message" id="register-confirm-password-error"></small>
        </div>

        <button type="submit" class="auth-btn">
          Register
        </button>

      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>

  </main>

  <script src="scripts.js"></script>
</body>
</html>
