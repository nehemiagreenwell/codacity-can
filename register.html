<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Codacity</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">Codacity</div>

    <div class="header-actions">

  <button class="theme-toggle" id="theme-toggle">
    🌙
  </button>

  <button class="menu-toggle" id="menu-toggle">
    &#9776;
  </button>

</div>

    <nav class="nav-menu" id="nav-menu">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="pricing.html">Pricing</a>
    </nav>
  </header>
  <!-- REGISTER SECTION -->
  <main class="auth-page">

    <div class="auth-card">

      <h1>Create Account</h1>

      <p class="auth-subtitle">
        Join the Codacity developer community
      </p>

      <form id="register-form">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="register-name"  placeholder="Enter your full name">
           <small class="error-message" id="register-name-error"></small>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="register-email" placeholder="Enter your email">
          <small class="error-message" id="register-email-error"></small>

        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="register-password" placeholder="Create password">
          <small class="error-message" id="register-password-error"></small>

        </div>
        
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="register-confirm-password" placeholder="Confirm password">
           <small class="error-message" id="register-confirm-password-error"></small>
        </div>

        <button type="submit" class="auth-btn">
          Register
        </button>

      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>

  </main>
<script>

/* =========================
   REGISTER FORM VALIDATION
========================= */

const registerForm =
  document.getElementById("register-form");

if (registerForm) {

  registerForm.addEventListener("submit", (e) => {

    e.preventDefault();

    const name =
      document.getElementById("register-name");

    const email =
      document.getElementById("register-email");

    const password =
      document.getElementById("register-password");

    const confirmPassword =
      document.getElementById(
        "register-confirm-password"
      );

    const nameError =
      document.getElementById(
        "register-name-error"
      );

    const emailError =
      document.getElementById(
        "register-email-error"
      );

    const passwordError =
      document.getElementById(
        "register-password-error"
      );

    const confirmPasswordError =
      document.getElementById(
        "register-confirm-password-error"
      );

    let isValid = true;

    /* RESET ERRORS */
    nameError.textContent = "";
    emailError.textContent = "";
    passwordError.textContent = "";
    confirmPasswordError.textContent = "";

    /* RESET INPUT STATES */
    name.classList.remove(
      "input-error",
      "input-success"
    );

    email.classList.remove(
      "input-error",
      "input-success"
    );

    password.classList.remove(
      "input-error",
      "input-success"
    );

    confirmPassword.classList.remove(
      "input-error",
      "input-success"
    );

    /* =========================
       NAME VALIDATION
    ========================= */

    if (name.value.trim() === "") {

      nameError.textContent =
        "Full name is required";

      name.classList.add("input-error");

      isValid = false;

    } else {

      name.classList.add(
        "input-success"
      );

    }

    /* =========================
       EMAIL VALIDATION
    ========================= */

    if (email.value.trim() === "") {

      emailError.textContent =
        "Email is required";

      email.classList.add(
        "input-error"
      );

      isValid = false;

    } else {

      email.classList.add(
        "input-success"
      );

    }

    /* =========================
       PASSWORD VALIDATION
    ========================= */

    if (password.value.trim() === "") {

      passwordError.textContent =
        "Password is required";

      password.classList.add(
        "input-error"
      );

      isValid = false;

    } else if (
      password.value.length < 6
    ) {

      passwordError.textContent =
        "Password must be at least 6 characters";

      password.classList.add(
        "input-error"
      );

      isValid = false;

    } else {

      password.classList.add(
        "input-success"
      );

    }

    /* =========================
       CONFIRM PASSWORD
    ========================= */

    if (
      confirmPassword.value.trim() === ""
    ) {

      confirmPasswordError.textContent =
        "Please confirm password";

      confirmPassword.classList.add(
        "input-error"
      );

      isValid = false;

    } else if (
      confirmPassword.value !==
      password.value
    ) {

      confirmPasswordError.textContent =
        "Passwords do not match";

      confirmPassword.classList.add(
        "input-error"
      );

      isValid = false;

    } else {

      confirmPassword.classList.add(
        "input-success"
      );

    }

    /* =========================
       SUCCESS
    ========================= */

    if (isValid) {

      alert(
        "Registration successful!"
      );

      registerForm.reset();

      /* REMOVE SUCCESS STATES */
      document
        .querySelectorAll(
          ".input-success"
        )
        .forEach((input) => {

          input.classList.remove(
            "input-success"
          );

        });

    }

  });

}


</script>
  <script src="scripts.js"></script>
</body>
</html>
